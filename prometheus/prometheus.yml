global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'liprobakin-monitor'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Tempo
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # Liprobakin.com Production Analytics
  - job_name: 'liprobakin-production'
    scheme: https
    metrics_path: '/api/analytics'
    scrape_interval: 30s
    static_configs:
      - targets: ['liprobakin.com']
    tls_config:
      insecure_skip_verify: false

  # Liprobakin Docker Container (for local deployment)
  - job_name: 'liprobakin-docker'
    scheme: http
    metrics_path: '/api/analytics'
    scrape_interval: 15s
    static_configs:
      - targets: ['liprobakin:3000']
        labels:
          environment: 'docker'

  # Liprobakin Local Development (scrape from host machine)
  - job_name: 'liprobakin-local'
    scheme: http
    metrics_path: '/api/analytics'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.168.1.54:3000']
        labels:
          environment: 'development'
